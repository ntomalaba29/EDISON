name: EDISON Software CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: TypeScript, PG16 Migrations, FFmpeg Worker, Vitest, Playwright Chromium & Vite Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edison
          POSTGRES_PASSWORD: edison_ci_password
          POSTGRES_DB: edison_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edison -d edison_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install FFmpeg & FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: TypeScript strict typecheck
        run: npm run lint

      - name: Apply & verify PostgreSQL 16 migrations against service container
        env:
          DATABASE_URL: postgresql://edison:edison_ci_password@localhost:5432/edison_ci
        run: npx tsx src/server/postgres/cli.ts up && npm run migrate:status

      - name: Run full Vitest suite (Unit, Security, PG16 PGlite, FFmpeg Worker, AURA, Reliability)
        # Local: --maxWorkers=1 to avoid 17 concurrency timeouts
        # CI: using --maxWorkers=1 per stash guidelines — individual filters pass;
        # full suite times out >30s with Workers=2 but passes with Workers=1
        run: npm test -- --maxWorkers=1 --testTimeout=60000

      - name: Run Playwright Chromium end-to-end tests
        run: npm run test:e2e

      - name: Build production frontend bundle
        run: npm run build

      - name: Upload Playwright HTML report on completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edison-playwright-report
          path: playwright-report/
          retention-days: 14
