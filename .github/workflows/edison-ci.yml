name: EDISON Software CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android TV unit tests and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android unit tests and assemble debug APK
        working-directory: android-tv
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  verify:
    name: TypeScript, PG16 Migrations, FFmpeg Worker, Vitest, Playwright Chromium & Vite Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edison
          POSTGRES_PASSWORD: edison_ci_password
          POSTGRES_DB: edison_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edison -d edison_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install FFmpeg & FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: TypeScript strict typecheck
        run: npm run lint

      - name: Apply & verify PostgreSQL 16 migrations against service container
        env:
          DATABASE_URL: postgresql://edison:edison_ci_password@localhost:5432/edison_ci
        run: npx tsx src/server/postgres/cli.ts up && npm run migrate:status

      - name: Run full Vitest suite (Unit, Security, PG16 PGlite, FFmpeg Worker, AURA, Reliability)
        run: npm test

      - name: Run Playwright Chromium end-to-end tests
        run: npm run test:e2e

      - name: Build production frontend bundle
        run: npm run build

      - name: Upload Playwright HTML report on completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edison-playwright-report
          path: playwright-report/
          retention-days: 14
